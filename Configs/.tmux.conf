# .tmux.conf

# Enable focus events so Neovim 'autoread' works correctly
set-option -g focus-events on

# True color support (alacritty terminal outside tmux)
set-option -a terminal-features 'alacritty:RGB'
set-option -a terminal-overrides 'alacritty:Tc'

# Reduce escape-time for Neovim responsiveness
set-option -sg escape-time 10

# Open new windows and panes in same working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
