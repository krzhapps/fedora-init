# .tmux.conf

# Enable focus events so Neovim 'autoread' works correctly
set-option -g focus-events on

# True color support (alacritty terminal outside tmux)
set-option -a terminal-features 'alacritty:RGB'
set-option -a terminal-overrides 'alacritty:Tc'

# Reduce escape-time for Neovim responsiveness
set-option -sg escape-time 10

# Open new windows and panes in same working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Auto-activate Python venv if .venv exists in current directory
set-hook -g after-new-window 'run-shell "tmux send-keys -t #{pane_id} \"[ -f .venv/bin/activate ] && source .venv/bin/activate && clear\" Enter"'
set-hook -g after-split-window 'run-shell "tmux send-keys -t #{pane_id} \"[ -f .venv/bin/activate ] && source .venv/bin/activate && clear\" Enter"'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-resurrect settings
set -g @resurrect-capture-pane-contents 'on'

# tmux-continuum settings
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'
